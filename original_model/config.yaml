# 시드머니 규모에 따른 동적 자산 배분 설정
strategy:
  phases:
    - min_balance: 0
      max_balance: 1000000        # 100만 원 미만
      scalping: 1.0               # 100% 스캘핑
      contrarian: 0.0
      stable: 0.0
    - min_balance: 1000000
      max_balance: 2000000        # 100만 원 ~ 200만 원 미만
      scalping: 0.8               # 80% 스캘핑
      contrarian: 0.2             # 20% 낙주매매
      stable: 0.0
    - min_balance: 2000000        # 200만 원 이상
      max_balance: 999999999
      scalping: 0.2               # 20% 스캘핑
      contrarian: 0.15            # 15% 낙주매매
      stable: 0.65                # 65% 안정수익
